plugins {
    id 'com.android.application'
}

android {
    namespace 'com.josue.ventas.movil'
    compileSdk 35

    defaultConfig {
        applicationId 'com.josue.ventas.movil'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sin dependencias externas: HttpURLConnection y org.json vienen incluidos en Android.
