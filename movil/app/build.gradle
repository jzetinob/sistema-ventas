plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.josue.ventas.movil'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.josue.ventas.movil'
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = '1.0'
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// HTTP (HttpURLConnection), JSON (org.json) y los graficos (Canvas) usan solo lo que trae Android.
// Unica libreria: el gesto oficial de "deslizar hacia abajo para actualizar".
dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}
